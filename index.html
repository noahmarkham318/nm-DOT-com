    body{

/* Containers */
    .container {
        display: flex;
        align-items: center;
        justify-content: space-evenly;
        flex-direction: column;
        justify-self: center;
        align-self: center;

        gap: 20px; padding: 20px;
        height: 100vh;

    }
    .footer {
        display: block;
        position: relative;
        color: white;
        background-color: white;
        width: 100%;
        height: 24px;
    }
    .BtnContainer {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
    }

/* Elements */
    .headerFIXEDBOX {
        width: 100%; height: 100px;
        position: fixed;
        background-color: black;
        top: 0; left: 0;
        display: flex; justify-content: center; align-items: center;
    }
    .headerFIXED {
        width: 500px;
        position: fixed;
    }
    .header {
        width: 33%; 
        margin-top: 2%;
    }
    .spacer {
        width: 100%; height: 100px;
        background-color: red;
        box-shadow: 0px 0px 1px red;
    }
    .hivemindbtn{
        margin: 5%;
    }

    .ytembed {
        width: 50%;
        aspect-ratio: 16/9;
        border-style: solid; border-color: black; border-width: 1px;
    }
    .linkbox {
        display: flex;
        width: 100%;
        justify-content: space-evenly; align-items: center;
        flex-direction: column;

    }
    .streamLINK {
        margin: 4px;
        font-family: 'Times New Roman', Times, serif; 
        font-size: 20px;
        text-align: center;
    }
    .logo {
        width: 5%; height: fit-content;
    }

/* Play Buttons */
    .play-button, .forward-button, .back-button {
            height: 32px;
            width: 32px;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            border-color: black

    }
    .play-button:hover, .forward-button:hover, .back-button:hover {
        transform: scale(.9);
        border-color: #1600ba;
        background-color: #1600ba;
    } 
    .playicon {
        height: 0px;
        width: 0px;
        border-top: 7px solid transparent;
        border-bottom: 7px solid transparent;
        border-left: 9px solid white;
        border-radius: 0px;
        
    }
    .pauseicon {
        height: 15px;
        width: 15px;
        background-color: transparent;
        border-width: 0px 0px 0px 9px;
        border-style: double;
        border-color: white;
        margin-left: 3.5px;
    }
    .playspeedicon{
        height: 15px; width: 15px;
        
        font-family: 'Times New Roman', Times, serif;
        color:white;

        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
    }
    .playspeedicon:hover{
        background-color: #1600ba;
    }
    .btnsrow{
        display: flex;
        justify-content: center;
        position: relative;
        left: 50%; transform: translate(-50%);
    }
    .btnscontainer{
        width: fit-content; padding: 1%;
        display: block;
        position: relative;
        left: 50%; transform: translate(-50%);
        margin-top: 2%;
        border-style: solid; border-width: 1px; border-color: black;
    }

/* Song Selector */
    .songselectordropdown{
        margin-top: 1%;
        position: fixed; 
        left: 50%; transform: translateX(-50%); bottom: 75px;
        text-align: center;
        border-style: solid; border-width: 1px; border-color: black;
        padding: 10px;
        width: fit-content;
        z-index: 4;
        background-color: white;
        box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.378);
        opacity: 95%;
        animation-name: fixedboxfadein; animation-timing-function: linear; animation-duration: 6s;
    }
    @keyframes fixedboxfadein{
        0% {opacity: 0%;}
        25% {opacity: 0%;}
        100% {opacity: 95%;}
    }
    .songselector{
        color: black;
        text-align: left;
        width: fit-content;
        border: 100%; border-radius: 3%;
        background-color: #ffffff;
        border-width: 1px; border-style: solid; border-color: black;
        font-family: 'Times New Roman', Times, serif; font-size: 14px;
        padding: 3px;
        animation-name: colorswitch; animation-duration: 6s; animation-timing-function: linear; animation-iteration-count: infinite;
    }
    .songselectorlabel{
        color: black;
        font-family: 'Times New Roman', Times, serif; font-size: 16px;
    }

/* Media Query For Mobile */
        @media (max-width: 1200px) {
            .header {width: 75%;}
            .linkbox {flex-direction: column;}
            .ytembed {width: 75%; height: auto; aspect-ratio: 16/9;}
            .in {font-size: 32px;}
            .meanwhile {font-size: 32px;}
            .streamLINK {font-size: 36px}
            .logo { width: 15%;}
        }
</style>
