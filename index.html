<html>
<style>
    body{
        margin: 0%;
    }
    .clock {
        text-align: center;
        font-family: 'Times New Roman', Times, serif;
        font-size: 64px;
        border-style: solid; border-width: 8px;
        padding: 4px;
    }
    .header {
        width: 44%; 

    }
    .container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;

    }
    .BtnContainer {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 4px;
        width: 100%;
    }
    .hivemindbtn{
        height: 24px;
    }
    .ytembed {
        width: 560px;
        height: 315px;
        margin-bottom: 5%;
    }

    /* Media Query For Mobile */
        @media (max-width: 1200px) {
            .header {width: 75%;}
        }
</style>

<body>
    <div class="container">
        <img src="https://Noah-Website-Assets.s3.us-west-000.backblazeb2.com/Strawberry+Perfect/Strawberry+Perfect.png" alt="StrawberryPerfect" class="header">    
        <p id="demo" class="clock"></p>
        
        <p>meanwhile:</p>
        <iframe class="ytembed" src="https://www.youtube.com/embed/qxwc1El8HL0?si=BNkRmxLBkyUX3r95" 
            title="YouTube video player" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
            referrerpolicy="strict-origin-when-cross-origin" 
            allowfullscreen>
        </iframe>

    </div>
</body>

<script>
    // Set the date we're counting down to
    var countDownDate = new Date("Sept 15, 2026 15:37:25").getTime();

    // Update the count down every 1 second
    var x = setInterval(function() {

    // Get today's date and time
    var now = new Date().getTime();
    
    // Find the distance between now and the count down date
    var distance = countDownDate - now;
    
    // Time calculations for days, hours, minutes and seconds
    var days = Math.floor(distance / (1000 * 60 * 60 * 24));
    var hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    var minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    var seconds = Math.floor((distance % (1000 * 60)) / 1000);
    
    // Output the result in an element with id="demo"
    document.getElementById("demo").innerHTML = days + "d " + hours + "h "
    + minutes + "m " + seconds + "s ";
        
    // If the count down is over, write some text 
    if (distance < 0) {
        clearInterval(x);
        document.getElementById("demo").innerHTML = "EXPIRED";
    }
    }, 1000);
    </script>
</html>
