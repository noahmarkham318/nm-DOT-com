<style>
    body{
        margin: 0%;
    }
/* Containers */
    .container {
        display: flex;
        align-items: center;

        align-self: center;

    .covercontainer {
        width: 100%;

    }

/* Header */
    .headerFIXEDBOX {
        width: 100%; height: 100px;
        position: fixed;
        background-color: black;
        top: 0; left: 0;

        width: 500px;

    }
    .coverart {

    }
    .backcoverart {
        width: 33%;

    }
    .header {
        width: 33%; 
        margin-top: 2%;
    }
    .spacer {
        width: 100%; height: 100px;
        background-color: red;
        box-shadow: 0px 0px 1px red;
    }
    /* Elements */
    .hivemindbtn{
        margin: 5%;
    }

    .ytembed {
        width: 33%;
        aspect-ratio: 16/9;
        border-style: solid; border-color: black; border-width: 1px;
    }
    .linkbox {
        display: flex;
        width: 100%;
        justify-content: space-evenly; align-items: center;
        flex-direction: column;
    }
    .streamLINK {
        margin: 4px;
        font-family: 'Times New Roman', Times, serif; 
        font-size: 20px;
        text-align: center;
    }
    .logo {
        width: 5%; height: auto; aspect-ratio: 1/1;
        margin: 25%;
        object-fit: contain;

    }

/* Play Buttons */
    .play-button, .forward-button, .back-button {
            height: 32px;
            width: 32px;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            text-decoration: none;
            border-color: black

    }
    .play-button:hover, .forward-button:hover, .back-button:hover {
        transform: scale(.9);
        border-color: #1600ba;
        background-color: #1600ba;
    } 
    .playicon {
        height: 0px;
        width: 0px;
        border-top: 7px solid transparent;
        border-bottom: 7px solid transparent;
        border-left: 9px solid white;
        border-radius: 0px;
        
    }
    .pauseicon {
        height: 15px;
        width: 15px;
        background-color: transparent;
        border-width: 0px 0px 0px 9px;
        border-style: double;
        border-color: white;
        margin-left: 3.5px;
    }
    .playspeedicon{
        height: 15px; width: 15px;
        
        font-family: 'Times New Roman', Times, serif;
        color:white;

        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
    }
    .playspeedicon:hover{
        background-color: #1600ba;
    }
    .btnsrow{
        display: flex;
        justify-content: center;
        position: relative;
        left: 50%; transform: translate(-50%);
    }
    .btnscontainer{
        width: fit-content; padding: 1%;
        display: block;
        position: relative;
        left: 50%; transform: translate(-50%);
        margin-top: 2%;
        border-style: solid; border-width: 1px; border-color: black;
    }

/* Song Selector */
    .songselectorcontainer{
        margin-top: 1%;
        position: fixed; 
        left: 50%; transform: translateX(-50%); bottom: 75px;
        text-align: center;
        border-style: solid; border-width: 1px; border-color: black;
        padding: 10px;
        width: fit-content;
        z-index: 4;
        background-color: white;
        box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.378);
        opacity: 95%;
        animation-name: fixedboxfadein; animation-timing-function: linear; animation-duration: 4s;
    }
    @keyframes fixedboxfadein{
        0% {opacity: 0%;}
        100% {opacity: 95%;}
    }
    .songselector{
        color: black;
        text-align: left;
        width: fit-content;
        border: 100%; border-radius: 3%;
        background-color: #ffffff;
        border-width: 1px; border-style: solid; border-color: black;
        font-family: 'Times New Roman', Times, serif; font-size: 14px;
        padding: 3px;
        animation-name: colorswitch; animation-duration: 6s; animation-timing-function: linear; animation-iteration-count: infinite;
    }
    .songselectorlabel{
        color: black;
        font-family: 'Times New Roman', Times, serif; font-size: 16px;
    }

/* Media Query For Mobile */
        @media (max-width: 1200px) {
            .container {gap: 20px; padding: 20px;}
            .headerFIXED {width: 750px;}
            .headerFIXEDBOX {height: 150px;}
            .spacer {height: 150px;}

            .ytembed {width: 75%; height: auto; aspect-ratio: 16/9;}
            .in {font-size: 32px;}
            .meanwhile {font-size: 32px;}
            .streamLINK {font-size: 36px}
            .logo {width: 15%; margin: 50%;}
            .coverart {width: 66%;}
            .backcoverart {display: none;}

            .play-button {height: 64px; width: 64px;}
            .playspeedicon {font-size: 3vw;}
            .btnscontainer {margin-top: 3%; padding: 0%; border-style: none;}
            .songselector {font-size: 3vw;}
            .songselectorlabel {font-size: 3vw;}
        }
</style>

<script>

//Tracks

//Play Pause Icon Toggle
let iconswitch = document.getElementById("playicon");
let player = document.getElementById("player");

function playpause() {   
    if (iconswitch.classList.contains("playicon")) {
        iconswitch.classList.remove("playicon");
        iconswitch.classList.add("pauseicon");
    }
    else {
        iconswitch.classList.remove("pauseicon");
        iconswitch.classList.add("playicon");
    }  
};

player.addEventListener("ended", playpause);

//Play Pause Toggle
function togglePlay() {
   return player.paused ? player.play() : player.pause();
};

//Playspeed

function halfspeed() {
   player.playbackRate = 0.5;
   player.preservesPitch = false;
};
function threequartspeed() {
   player.playbackRate = 0.75;
   player.preservesPitch = false;
};
function normalspeed() {
   player.playbackRate = 1;
   player.preservesPitch = false;
};
function onepointfivespeed() {
   player.playbackRate = 1.5;
   player.preservesPitch = false;
};
function twicespeed() {
   player.playbackRate = 2;
   player.preservesPitch = false; 
};

//Start From Beginning
function startover(){
    player.currentTime = 0
}

document.getElementById("startoverbtn").addEventListener("click", startover)

//Next & Back Buttons
const membershipEl = document.getElementById("membership");

//Song Selector
const sounds = {
  MiraclesinApril: {
    url: "https://Noah-Website-Assets.s3.us-west-000.backblazeb2.com/Strawberry+Perfect/Audio/from+first+piano+since_9+(mix+9+ALBUM)_Master.wav"
  },
  FTLOOB: {
    url: "https://Noah-Website-Assets.s3.us-west-000.backblazeb2.com/Strawberry+Perfect/Audio/For+the+Love+of+OR+Beber+(mix+7).wav"
  },
  ChasingRibbons: {
    url: "https://Noah-Website-Assets.s3.us-west-000.backblazeb2.com/Strawberry+Perfect/Audio/Chasing+Ribbons+(ft+T)+(mix+13-1).wav"
  },
  Alba: {
    url: "https://Noah-Website-Assets.s3.us-west-000.backblazeb2.com/Strawberry+Perfect/Audio/Alba+(mix+14).wav"
  },
  TenLetters: {
    url: "https://Noah-Website-Assets.s3.us-west-000.backblazeb2.com/Strawberry+Perfect/Audio/Ten+Letters+(shoudler)+(mix+4).wav"
  },
  ZapataPowerball: {
    url: "https://Noah-Website-Assets.s3.us-west-000.backblazeb2.com/Strawberry+Perfect/Audio/zapata+powerball+(yue)+(demo).wav"
  },
  TriptoVegas: {
    url: "https://Noah-Website-Assets.s3.us-west-000.backblazeb2.com/Strawberry+Perfect/Audio/trip+to+vegas+(lobotomy)+(mix+1).wav"
  },
  PWPSAS: {
    url: "https://Noah-Website-Assets.s3.us-west-000.backblazeb2.com/Strawberry+Perfect/Audio/but+you+know+me+get+off_5+(mix+4)_Master.wav"
  },
};

player.src = sounds[membershipEl.value].url;

membershipEl.addEventListener("change", (e) => {
    player.src = sounds[e.target.value].url; 
    iconswitch.classList.remove("pauseicon");
    iconswitch.classList.add("playicon");
});

</script>
